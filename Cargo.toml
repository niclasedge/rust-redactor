[package]
name = "redactor"
version = "0.8.1"
edition = "2021"
authors = ["Niclas Edge"]
description = "Single-binary CLI that redacts secrets in stdin/files for use as a pre-tool-use hook in Codex/OpenCode/Claude Code"
license = "MIT"
repository = "https://github.com/niclasedge/rust-redactor"

[[bin]]
name = "redactor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
toml = "0.8"
probly-search = "2.0"
pulldown-cmark = { version = "0.10", default-features = false }
walkdir = "2"
ignore = "0.4"
globset = "0.4"
notify-rust = "4"
arboard = { version = "3", default-features = false }
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
